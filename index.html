<!doctype html>
<html lang="es-ES">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>%TITLE%</title>
    <meta name="description" content="%DESCRIPTION%" />
    <meta name="theme-color" content="#1c2a23" />
    <link rel="canonical" href="%URL%/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:site_name" content="%SITE_NAME%" />
    <meta property="og:url" content="%URL%/" />
    <meta property="og:title" content="%TITLE%" />
    <meta property="og:description" content="%DESCRIPTION%" />
    <meta property="og:image" content="%OG_IMAGE%" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <!--
      Fuentes: preconnect + display=swap. La hoja la inyecta src/main.tsx justo después del primer pintado:
      así el texto aparece al instante con fuentes de reserva de métricas ajustadas (sin saltos) y luego cambia.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <meta name="fonts-href" content="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:ital,wght@0,500;0,600;1,400;1,500&display=swap" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:ital,wght@0,500;0,600;1,400;1,500&display=swap" /></noscript>

    <!-- Imagen del hero: se pide en paralelo con el JS para mejorar el LCP -->
    <link rel="preconnect" href="https://images.unsplash.com" />
    <link rel="preload" as="image" imagesrcset="%HERO_SRCSET%" imagesizes="100vw" fetchpriority="high" />

    <script type="application/ld+json">%JSON_LD%</script>

    <!--
      Bloqueo previo de scripts: los scripts con type="text/plain" y data-consent="<categoría>"
      NO se ejecutan hasta que la persona acepta esa categoría (src/lib/consent.ts los activa).
      Es el mismo patrón que usan Complianz o CookieYes en WordPress.
    -->
    <script type="text/plain" data-consent="analytics" src="/analytics-demo.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <noscript><p style="padding:24px;font-family:Georgia,serif">Senderos con Laura · Excursiones guiadas en Andalucía. WhatsApp +34 600 000 000.</p></noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
